<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>El Gato Fán</title>
        <link rel="stylesheet" href=".../bootstrap.min.css">
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <h1>El Gato Fán</h1>
            <nav>...</nav>
        </header>
        <main>
            <section id="menu">
                <h2>Nuestro menú</h2>
                <div id ="menu-items"></div>
            </section>
            <section id="pedidos" class="container my-5">
                <h2>Registrar pedido</h2>
                <form id="form-pedido" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Cliente</label>
                        <input id="nombre" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Plato</label>
                        <select id="plato" class="form-select">
                            <option value="">Selecciona un plato</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Cantidad</label>
                        <input id="cantidad" type="number" class="form-control">
                    </div>
                    <button id="btn-agregar" type="button" class="btn btn-primary">
                        Agregar
                    </button>
                </form>
            </section>
            <table class="table table-striped mt-4">
                <thead>
                    <tr><th>Cliente</th>
                        <th>Plato</th><th>Cant.</th></tr>
                </thead>
                <tbody id="tabla-pedidos"></tbody>
            </table>
            <section id="nosotros">...</section>
        </main>
        <footer>...</footer>

        <script src=".../bootstrap.bundle.min.js"></script>
        <script src="js/data.js"></script>
        <script src="js/app.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
